name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ─────────────────────────────────────────
  # Code Style / Formatting Check
  # ─────────────────────────────────────────
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find include src examples test -type f \( -name "*.h" -o -name "*.cpp" \) -print0 | xargs -0 clang-format --dry-run --Werror

  # ─────────────────────────────────────────
  # Linux (Ubuntu + GCC)
  # ─────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.build_type }}, SSL=${{ matrix.ssl }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        ssl: [OFF, ON]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DFASTNET_ENABLE_SSL=${{ matrix.ssl }} \
            -DFASTNET_BUILD_EXAMPLES=ON \
            -DFASTNET_BUILD_TESTS=ON \
            -DFASTNET_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 60

  # ─────────────────────────────────────────
  # Windows (MSVC)
  # ─────────────────────────────────────────
  windows:
    name: Windows (${{ matrix.build_type }}, SSL=OFF)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DFASTNET_ENABLE_SSL=OFF `
            -DFASTNET_BUILD_EXAMPLES=ON `
            -DFASTNET_BUILD_TESTS=ON `
            -DFASTNET_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure --timeout 60
